site_url: https://atelier3rd.netlify.app
display_url: https://atelier3rd.netlify.app
logo_url: /uploads/logo.png

backend:
  name: github
  repo: dodochiang/atelier3rd
  branch: main

media_library:
  name: cloudinary
  config:
    cloud_name: dw6nekwxn
    api_key: 414678917212337
    multiple: false
    default_transformations:
      - - fetch_format: auto
          quality: auto

media_folder: "static/uploads"   # 存在 repo 的位置
public_folder: "/uploads"        # 網站公開路徑（配合 Eleventy passthrough）

editor:
  preview: true

collections:
  # ========== Projects ==========
  - name: "projects"
    label: "項目"
    folder: "projects"
    create: true
    slug: "{{title_en}}"
    identifier_field: "title_zh"
    summary: "{{title_zh}} / {{title_en}} — {{year}} · {{type}}"
    sortable_fields: ["year", "title_zh", "title_en", "commit_date"]
    thumbnail: "cover"
    preview_path: "projects/{{slug}}/"
    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "project.njk"

      - label: "作品名稱（EN）"
        name: "title_en"
        widget: "string"
        required: true
        hint: "英文項目名稱；例：Riverside House"

      - label: "作品名稱（中文）"
        name: "title_zh"
        widget: "string"
        required: true
        hint: "中文項目名稱；例：伸港黃宅"

      - label: "作品類型（中文）"
        name: "type"
        widget: "select"
        multiple: false
        required: false
        options:
          - 住宅
          - 商業
          - 文化
          - 公共
          - 裝置
          - 工作營
          - 展覽
        hint: "選擇主要類型（中文）"

      - label: "地點（EN，可留白）"
        name: "location_en"
        widget: "string"
        required: false
        hint: "例：Taichung, Taiwan"

      - label: "地點（中文，可留白）"
        name: "location_zh"
        widget: "string"
        required: false
        hint: "例：台中，台灣"

      - label: "年份"
        name: "year"
        widget: "number"
        value_type: "int"
        min: 1900
        max: 2100
        required: true
        hint: "四位數；例如 2024"

      - label: "戶數"
        name: "units"
        widget: "number"
        value_type: "int"
        min: 1
        required: false
        hint: "整數；例：12（戶）"

      - label: "總樓地板面積（m²）"
        name: "floor_area"
        widget: "number"
        value_type: "float"
        required: false
        hint: "平方公尺；可小數，例如 3820.5"

      - label: "Card Thumbnail (auto)"
        name: "thumbnail"
        widget: "hidden"
        default: ""

      - label: "縮圖"
        name: "cover"
        widget: "image"
        choose_url: false
        required: false
        allow_multiple: false
        hint: "建議 1200×900（4:3）JPG"
        media_library:
          config:
            multiple: false
        pattern:
          - '^[^\[\]]*$'
          - "此欄位只允許單一圖片；請勿一次插入多張"

      # 在 projects 的 fields 裡，加在原來 gallery 旁邊
      - label: "簡易相簿（多選）"
        name: "gallery_images"
        widget: "file"
        multiple: true          # 一次多選
        required: false
        media_library:
          config:
            multiple: true
        hint: "可一次多選多張；若需要說明，改用下方的進階相簿"

      # 你原本就有的進階相簿（保留）
      - label: "圖片集（進階：含說明）"
        name: "gallery"
        widget: "list"
        label_singular: "圖片"
        collapsed: true
        fields:
          - { label: "圖片", name: "image", widget: "image", required: false }
          - { label: "說明（EN）", name: "caption_en", widget: "string", required: false }
          - { label: "說明（中文）", name: "caption_zh", widget: "string", required: false }

      - { label: "內容（EN）", name: "body_en", widget: "markdown", required: false, hint: "英文敘述；支援 Markdown" }
      - { label: "內容（中文）", name: "body_zh", widget: "markdown", required: false, hint: "中文敘述；支援 Markdown" }

 # 新增：Credits / 致謝（小字顯示）
      - { label: "Credits (EN)", name: "credits_en", widget: "markdown", required: false, hint: "可用換行或無序清單" }
      - { label: "致謝（中文）", name: "credits_zh", widget: "markdown", required: false, hint: "可用換行或無序清單" }

      - label: "影片連結（YouTube Embed URL）"
        name: "video"
        widget: "string"
        required: false
        hint: "請用 https://www.youtube.com/embed/XXXXXX"
        pattern:
          - '^$|^https:\/\/www\.youtube\.com\/embed\/[A-Za-z0-9_-]+'
          - "格式錯誤，請使用 https://www.youtube.com/embed/XXXXXX"

  # ========== Pages (Home / About / Contact) ==========
  - name: "pages"
    label: "頁面"
    delete: false
    editor:
      preview: true
    files:

      # About
      - file: "page/about.md"
        label: "About 關於"
        name: "about"
        preview_path: "/about/"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "layout.njk" }
          - { label: "Title (EN)", name: "title_en", widget: "string", required: false }
          - { label: "Title (ZH)", name: "title_zh", widget: "string", required: false }
          - { label: "Body (EN)", name: "body_en", widget: "markdown", required: false }
          - { label: "Body (ZH)", name: "body_zh", widget: "markdown", required: false }
