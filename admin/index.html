<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Content Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Optional: Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- 後台整體樣式（縮小版 UI） -->
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body>
    <!-- Decap CMS v3 -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Cloudinary media library plugin -->
    <script src="https://unpkg.com/decap-cms-media-library-cloudinary@^3.0.0/dist/decap-cms-media-library-cloudinary.js"></script>

    <script>
      (function () {
        function ready(fn){
          if (document.readyState !== 'loading') fn();
          else document.addEventListener('DOMContentLoaded', fn);
        }

        // 把任意型態（Array / Immutable.List / Immutable.Map / Object / String）
        // 統一轉成乾淨的 URL 字串
        function normalizeUrl(v) {
          try {
            if (Array.isArray(v)) v = v.length ? v[0] : '';
            // Immutable List
            if (v && typeof v.get === 'function' && typeof v.size === 'number') {
              v = v.size > 0 ? v.get(0) : '';
            }
            // Immutable Map
            if (v && typeof v.get === 'function' && typeof v.size !== 'number') {
              v = v.get('secure_url') || v.get('url') || v.get('path') || v.get('src') || '';
            }
            // 一般物件（Cloudinary 物件）
            if (v && typeof v === 'object') {
              v = v.secure_url || v.url || v.path || v.src || '';
            }
            // 字串清理 ["..."] / 收尾雜字元與 List[...] 汙染
            if (typeof v === 'string') {
              v = v.replace(/^[\[\s"]+/, '').replace(/[\s"\]]+$/, '');
              if (/\bList\b|\[|\]/.test(v)) return '';
            }
            return (typeof v === 'string') ? v : '';
          } catch { return ''; }
        }

        function installGuards() {
          if (!window.CMS) return;

          try { CMS.setLocale && CMS.setLocale('en'); } catch (e) {}
          try { CMS.registerMediaLibrary(cloudinary); } catch (e) {}
          try { CMS.registerPreviewStyle('/admin/preview.css'); } catch (e) {}

          // 在各事件點把 projects.cover 正規化為單一字串 URL
          function normalizeOnEvent({ entry, collection }) {
            if (!collection || collection.get('name') !== 'projects') return;

            const data = entry.get('data');
            const raw  = data && data.get && data.get('cover');
            const norm = normalizeUrl(raw);

            return { entry: entry.set('data', data.set('cover', norm)) };
          }

          CMS.registerEventListener({ name: 'entryChange', handler: normalizeOnEvent });
          CMS.registerEventListener({ name: 'preSave',     handler: normalizeOnEvent });
          CMS.registerEventListener({ name: 'prePublish',  handler: normalizeOnEvent });
        }

        ready(installGuards);
      })();
    </script>

    <!-- 你的 CMS 初始化（Cloudinary 註冊、Preview 樣式、Project/Pages 預覽模板…） -->
    <script src="/admin/cms.js"></script>
  </body>
</html>
