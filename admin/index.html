<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Content Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Netlify Identity（可留可拿掉） -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- 後台整體樣式（你的縮小 UI） -->
    <link rel="stylesheet" href="/admin/admin.css">
    <!-- 讓預覽看起來接近前台 -->
    <link rel="stylesheet" href="/admin/preview.css">
  </head>
  <body>
    <!-- Decap CMS v3 -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Cloudinary media library plugin -->
    <script src="https://unpkg.com/decap-cms-media-library-cloudinary@^3.0.0/dist/decap-cms-media-library-cloudinary.js"></script>

    <script>
      (function () {
        function ready(fn){
          if (document.readyState !== 'loading') fn();
          else document.addEventListener('DOMContentLoaded', fn);
        }

        // 把任何型態 → 單一乾淨 URL 字串（最後一個 URL）
        function normalizeUrl(v) {
          try {
            if (Array.isArray(v)) v = v.length ? v[v.length - 1] : '';
            if (v && typeof v.get === 'function' && typeof v.size === 'number') {
              v = v.size > 0 ? v.get(v.size - 1) : '';         // Immutable.List 取最後
            }
            if (v && typeof v.get === 'function' && typeof v.size !== 'number') {
              v = v.get('secure_url') || v.get('url') || v.get('path') || v.get('src') || ''; // Immutable.Map
            } else if (v && typeof v === 'object') {
              v = v.secure_url || v.url || v.path || v.src || ''; // 一般物件
            }
            if (typeof v === 'string') {
              let s = v.trim().replace(/^[\[\s"]+/, '').replace(/[\s"\]]+$/, '');
              const urls = s.match(/https?:\/\/[^\s"'\]]+/g);
              if (urls && urls.length) s = urls[urls.length - 1];
              s = s.replace(/%22/g, '').replace(/\]$/, '');
              if (/\bList\b|\[|\]/.test(s)) return '';
              return s;
            }
            return (typeof v === 'string') ? v : '';
          } catch { return ''; }
        }

        // ✅ 重點：只處理 URL 的 pathname，一律「decode 再 encode」
        function reencodePath(urlStr) {
          try {
            const u = new URL(urlStr);
            // 防止雙重編碼：先 decode 一次，再 encodeURI 回去
            u.pathname = encodeURI(decodeURI(u.pathname));
            return u.toString();
          } catch {
            return urlStr;
          }
        }

        function install() {
          if (!window.CMS) return;

          try { CMS.setLocale && CMS.setLocale('en'); } catch {}
          try { CMS.registerMediaLibrary(cloudinary); } catch {}
          try { CMS.registerPreviewStyle('/admin/preview.css'); } catch {}

          // 存稿 / 發布前：cover → 單值字串、並 re-encode 路徑、同步到 thumbnail（供 Grid 用）
          function normalizeOnEvent({ entry, collection }) {
            if (!collection || collection.get('name') !== 'projects') return;
            const data = entry.get('data');
            const raw  = data && data.get && data.get('cover');
            let url    = normalizeUrl(raw);
            if (url) url = reencodePath(url);  // ⬅️ 修正中文/特殊字元路徑
            const next = data.set('cover', url).set('thumbnail', url);
            return { entry: entry.set('data', next) };
          }

          CMS.registerEventListener({ name: 'preSave',    handler: normalizeOnEvent });
          CMS.registerEventListener({ name: 'prePublish', handler: normalizeOnEvent });
        }

        ready(install);
      })();
    </script>

    <!-- 自訂預覽（完整樣板在 cms.js） -->
    <script src="/admin/cms.js"></script>
  </body>
</html>
