<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Content Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link rel="stylesheet" href="/admin/admin.css">
    <link rel="stylesheet" href="/admin/preview.css">
  </head>
  <body>
    <!-- Decap CMS v3 -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Cloudinary media library plugin -->
    <script src="https://unpkg.com/decap-cms-media-library-cloudinary@^3.0.0/dist/decap-cms-media-library-cloudinary.js"></script>

    <script>
    (function () {
      function ready(fn){ document.readyState !== 'loading' ? fn() : document.addEventListener('DOMContentLoaded', fn); }

      // 你現有的 normalizeUrl() 請保留

      function install() {
        if (!window.CMS) return;

        try { CMS.setLocale && CMS.setLocale('en'); } catch {}
        try { CMS.registerMediaLibrary(cloudinary); } catch {}
        try { CMS.registerPreviewStyle('/admin/preview.css'); } catch {}

        // ★ 儲存/發布前，把 cover 轉為單一字串（避免 YAML 陣列的 dash）
        function normalizeOnEvent({ entry, collection }) {
          if (!collection || collection.get('name') !== 'projects') return;
          const data = entry.get('data');
          const clean = normalizeUrl(data && data.get && data.get('cover'));
          return { entry: entry.set('data', data.set('cover', clean)) };
        }
        CMS.registerEventListener({ name: 'preSave',    handler: normalizeOnEvent });
        CMS.registerEventListener({ name: 'prePublish', handler: normalizeOnEvent });

        // ★ 用 React（不是 Preact 的 h）
        const React = (window.React) || (CMS && CMS.lib && CMS.lib.React);
        if (!React) return;
        const h = React.createElement;

        const ProjectPreview = (props) => {
          const e = props.entry;
          const get = (path) => e.getIn(path);

          const titleEn = get(['data','title_en']) || '';
          const titleZh = get(['data','title_zh']) || '';
          const title   = titleZh || titleEn || 'Untitled';

          const type  = get(['data','type']) || '';
          const locEn = get(['data','location_en']) || get(['data','location']) || '';
          const locZh = get(['data','location_zh']) || get(['data','location']) || '';
          const year  = get(['data','year']) || '';
          const units = get(['data','units']) || '';
          const floor = get(['data','floor_area']) || '';

          const cover = normalizeUrl(get(['data','cover']));
          const video = (get(['data','video']) || '').toString();

          const bodyNode      = (props.widgetFor && (props.widgetFor('body_zh') || props.widgetFor('body_en'))) || null;
          const creditsEnNode = props.widgetFor && props.widgetFor('credits_en');
          const creditsZhNode = props.widgetFor && props.widgetFor('credits_zh');

          return h('div', { className: 'cms-preview-content' },
            // hero
            cover ? h('div', { className: 'project-hero' },
              h('img', { src: cover, alt: title })
            ) : null,

            // title
            h('h1', { className: 'project-title' },
              titleEn ? h('span', { className:'lang-en' }, titleEn) : null,
              titleZh ? h('span', { className:'lang-zh' }, titleZh) : null
            ),

            // meta 兩行
            h('div', { className: 'project-meta' },
              h('div', { className: 'project-meta-line' },
                h('span', { className:'lang-en' }, [
                  String(type || ''),
                  locEn ? ' ｜ ' + String(locEn) : ''
                ]),
                h('span', { className:'lang-zh' }, [
                  String(type || ''),
                  locZh ? ' ｜ ' + String(locZh) : ''
                ])
              ),
              h('div', { className: 'project-meta-line' },
                h('span', { className:'lang-en' }, [
                  units ? String(units) + ' units' : '',
                  floor ? (units ? ' ｜ ' : '') + String(floor) + ' sqm' : '',
                  year  ? ((units || floor) ? ' ｜ ' : '') + String(year) : ''
                ]),
                h('span', { className:'lang-zh' }, [
                  units ? String(units) + '戶' : '',
                  floor ? (units ? ' ｜ ' : '') + String(floor) + '㎡' : '',
                  year  ? ((units || floor) ? ' ｜ ' : '') + String(year) : ''
                ])
              )
            ),

            // body
            h('div', { className: 'project-content' }, bodyNode),

            // credits
            (creditsEnNode || creditsZhNode) ?
              h('div', { className: 'project-credits' },
                creditsEnNode || null,
                creditsZhNode || null
              ) : null,

            // YouTube
            (video && /^https?:\/\/.+/.test(video)) ?
              h('div', { className: 'project-video', style: { textAlign:'center', marginTop:'2em' } },
                h('div', { className: 'video-container' },
                  h('iframe', { src: video, title: 'YouTube video', frameBorder: 0, allowFullScreen: true })
                )
              ) : null
          );
        };

        try { CMS.registerPreviewTemplate('projects', ProjectPreview); } catch {}
      }

      ready(install);
    })();
    </script>

    <script src="/admin/cms.js"></script>
  </body>
</html>
