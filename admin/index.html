<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Content Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Optional: Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- 自訂 CMS 外觀 -->
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body>
    <!-- Decap CMS v3 -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Cloudinary media library for Decap -->
    <script src="https://unpkg.com/decap-cms-media-library-cloudinary@^3.0.0/dist/decap-cms-media-library-cloudinary.js"></script>

    <script>
      (function () {
        function ready(fn) {
          if (document.readyState !== 'loading') return fn();
          document.addEventListener('DOMContentLoaded', fn);
        }

        ready(function () {
          const { CMS, createClass, h } = window;
          if (!CMS || !createClass || !h) {
            console.error('Decap CMS did not load (CMS/createClass/h missing).');
            return;
          }

          // Register Cloudinary AFTER Decap and plugin are loaded
          if (window.cloudinary) {
            CMS.registerMediaLibrary(window.cloudinary);
          } else {
            console.warn('Cloudinary media library script not found or not loaded yet.');
          }

          // Optional: extra styles for preview pane
          try { CMS.registerPreviewStyle('/admin/preview.css'); } catch {}

          // Optional: return to /admin/ after login
          if (window.netlifyIdentity) {
            window.netlifyIdentity.on('init', (user) => {
              if (!user) {
                window.netlifyIdentity.on('login', () => {
                  document.location.href = '/admin/';
                });
              }
            });
          }

          // ===== Helpers =====
          const TYPE_EN = {
            '住宅': 'Residential',
            '商業': 'Commercial',
            '文化': 'Cultural',
            '公共': 'Public',
            '裝置': 'Installation',
            '工作營': 'Workshop',
            '展覽': 'Exhibition',
          };

          const normSrc = (src) => {
            if (!src) return '';
            const s = String(src);
            return /^https?:\/\//i.test(s) ? s : (s.startsWith('/') ? s : '/' + s);
          };

          const ensureStr = (v) => (v === null || v === undefined) ? '' : String(v);

          // 若是純數字，英文補 ' sqm'、中文補 '㎡'
          const fmtArea = (v, lang) => {
            if (v === null || v === undefined || v === '') return '';
            const s = String(v).trim();
            const hasUnit = /㎡|m²|sqm/i.test(s);
            if (hasUnit) return s;
            return lang === 'zh' ? (s + '㎡') : (s + ' sqm');
          };

          // 若是純數字，英文補 ' units'、中文補 '戶'
          const fmtUnits = (v, lang) => {
            if (v === null || v === undefined || v === '') return '';
            const s = String(v).trim();
            const hasUnit = /戶|units/i.test(s);
            if (hasUnit) return s;
            return lang === 'zh' ? (s + '戶') : (s + ' units');
          };

          const SEP = '｜'; // 全形豎線

          // ===== Projects Preview =====
          const ProjectPreview = createClass({
            render() {
              const entry = this.props.entry;

              const get = (k) => entry.getIn(['data', k]);
              const getList = (k) => entry.getIn(['data', k]) || [];

              const title_en = ensureStr(get('title_en'));
              const title_zh = ensureStr(get('title_zh'));
              const year     = ensureStr(get('year'));
              const loc_en   = ensureStr(get('location_en'));
              const loc_zh   = ensureStr(get('location_zh'));
              const typeZh   = ensureStr(get('type'));
              const type_en  = TYPE_EN[typeZh] || '';

              // new meta
              const floor_area = get('floor_area'); // number or string
              const units      = get('units');      // number or string

              const thumbnail  = ensureStr(get('thumbnail'));
              const heroSrc    = normSrc(thumbnail);

              const gallery    = (getList('gallery').toJS?. && getList('gallery').toJS()) || [];
              const galleryImgs= (getList('gallery_images').toJS?. && getList('gallery_images').toJS()) || [];

              // 合併兩種相簿來源：優先進階（有 caption），否則多選圖片
              let previewList = [];
              if (Array.isArray(gallery) && gallery.length) {
                previewList = gallery.map(it => ({
                  image: normSrc(it.image),
                  caption_en: ensureStr(it.caption_en),
                  caption_zh: ensureStr(it.caption_zh),
                })).filter(it => it.image);
              } else if (Array.isArray(galleryImgs) && galleryImgs.length) {
                previewList = galleryImgs.map(src => ({
                  image: normSrc(src),
                  caption_en: '',
                  caption_zh: '',
                })).filter(it => it.image);
              }

              const body_en = this.props.widgetFor('body_en');
              const body_zh = this.props.widgetFor('body_zh');

              // 地點的逗號安全化（預覽面板也做一次，視覺仍是逗號）
              const loc_en_safe = loc_en.replace(/,/g, '&#44;');
              const loc_zh_safe = loc_zh.replace(/，/g, '&#65292;').replace(/,/g, '&#44;');

              // 兩行 meta（第1行：類型｜地點；第2行：戶數｜面積｜年份）
              const line1_en = [type_en, loc_en_safe].filter(Boolean).join(SEP);
              const line1_zh = [typeZh,  loc_zh_safe].filter(Boolean).join(SEP);

              const u_en = fmtUnits(units, 'en');
              const u_zh = fmtUnits(units, 'zh');
              const a_en = fmtArea(floor_area, 'en');
              const a_zh = fmtArea(floor_area, 'zh');

              const line2_en = [u_en, a_en, year].filter(Boolean).join(SEP);
              const line2_zh = [u_zh, a_zh, year].filter(Boolean).join(SEP);

              const first = previewList[0];

              return h('div', { className: 'cms-preview-content', style: { paddingBottom: '2rem' } },

                // hero
                heroSrc && h('div', { className: 'project-hero', style: { position: 'relative', width: '100%', aspectRatio: '16 / 9', overflow: 'hidden' } },
                  h('img', { src: heroSrc, alt: 'Project thumbnail', style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' } })
                ),

                // title
                h('h1', { className: 'project-title', style: { textAlign: 'center', margin: '1em 0' } },
                  h('span', { className: 'lang-en', style: { display: 'block' } }, title_en || ''),
                  h('span', { className: 'lang-zh', style: { display: 'block', fontWeight: 'normal' } }, title_zh || '')
                ),

                // meta line 1
                h('p', { className: 'project-meta-line', style: { textAlign: 'center', color: 'gray', margin: '.25em 0' } },
                  h('span', { className: 'lang-en', style: { display: 'block' } }, line1_en),
                  h('span', { className: 'lang-zh', style: { display: 'block' } }, line1_zh)
                ),
                // meta line 2
                h('p', { className: 'project-meta-line', style: { textAlign: 'center', color: 'gray', margin: '.25em 0' } },
                  h('span', { className: 'lang-en', style: { display: 'block' } }, line2_en),
                  h('span', { className: 'lang-zh', style: { display: 'block' } }, line2_zh)
                ),

                // body
                h('div', { className: 'project-content', style: { maxWidth: '800px', margin: '1.5em auto' } },
                  h('div', { className: 'lang-en' }, body_en),
                  h('div', { className: 'lang-zh' }, body_zh)
                ),

                // first gallery image preview (簡單帶一張就好，避免預覽面板過重)
                first && h('div', { className: 'project-slider', style: { maxWidth: '100%', margin: '2em auto' } },
                  h('div', { className: 'slide-image-wrapper', style: { position: 'relative', width: '100%', aspectRatio: '16 / 9', overflow: 'hidden' } },
                    h('img', { src: first.image, alt: 'Preview image', style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' } })
                  ),
                  (first.caption_en || first.caption_zh) &&
                  h('div', { className: 'gallery-caption', style: { textAlign: 'center', color: 'gray', marginTop: '.5em' } },
                    h('div', { className: 'lang-en' }, first.caption_en || ''),
                    h('div', { className: 'lang-zh' }, first.caption_zh || '')
                  )
                )
              );
            }
          });

          CMS.registerPreviewTemplate('projects', ProjectPreview);
        });
      })();
    </script>
  </body>
</html>
