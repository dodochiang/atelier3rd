<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Content Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link rel="stylesheet" href="/admin/admin.css">
    <!-- 讓預覽有基本排版（可選） -->
    <link rel="stylesheet" href="/admin/preview.css">
  </head>
  <body>
    <!-- Decap CMS v3 -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Cloudinary media library plugin -->
    <script src="https://unpkg.com/decap-cms-media-library-cloudinary@^3.0.0/dist/decap-cms-media-library-cloudinary.js"></script>

    <script>
      (function () {
        function ready(fn){
          if (document.readyState !== 'loading') fn();
          else document.addEventListener('DOMContentLoaded', fn);
        }

        // 把任何型態 → 乾淨 URL 字串；若是多值（Array / 逗號或空白分隔字串）→ 取「最後一張」
        function normalizeUrl(v) {
          try {
            // Array / Immutable.List
            if (Array.isArray(v)) v = v.length ? v[v.length - 1] : '';
            if (v && typeof v.get === 'function' && typeof v.size === 'number') {
              v = v.size > 0 ? v.get(v.size - 1) : '';
            }

            // Immutable.Map / 一般物件（Cloudinary 物件）
            if (v && typeof v.get === 'function' && typeof v.size !== 'number') {
              v = v.get('secure_url') || v.get('url') || v.get('path') || v.get('src') || '';
            } else if (v && typeof v === 'object') {
              v = v.secure_url || v.url || v.path || v.src || '';
            }

            // String：清雜訊 + 處理多值（逗號/空白/換行）
            if (typeof v === 'string') {
              let s = v.trim()
                .replace(/^[\[\s"]+/, '')
                .replace(/[\s"\]]+$/, '');

                // ✅ 從字串中抓出「所有完整 URL」，只取最後一個
                // （不會被 f_auto,q_auto 的逗號影響）
                const urls = s.match(/https?:\/\/[^\s"'\]]+/g);
                if (urls && urls.length) {
                  s = urls[urls.length - 1];
                }


              // 去除殘餘的 URL-encoded 雜字（例如 %22）
              s = s.replace(/%22/g, '').replace(/\]$/, '');

              // 防呆
              if (/\bList\b|\[|\]/.test(s)) return '';

              v = s;
            }

            return (typeof v === 'string') ? v : '';
          } catch { return ''; }
        }
        function install() {
          if (!window.CMS) return;

          try { CMS.setLocale && CMS.setLocale('en'); } catch {}
          try { CMS.registerMediaLibrary(cloudinary); } catch {}
          try { CMS.registerPreviewStyle('/admin/preview.css'); } catch {}

          // 任一變更/存檔/發布前：把 cover → 單值，並同步到 thumbnail（只供 CMS Grid 用）
          function normalizeOnEvent({ entry, collection }) {
            if (!collection || collection.get('name') !== 'projects') return;
            const data = entry.get('data');

            const rawCover = data && data.get && data.get('cover');
            const coverUrl = normalizeUrl(rawCover);

            // 同步一份到 thumbnail，讓 Grid 一定有圖
            const next = data.set('cover', coverUrl).set('thumbnail', coverUrl);
            return { entry: entry.set('data', next) };
          }


          CMS.registerEventListener({ name: 'preSave',     handler: normalizeOnEvent });
          CMS.registerEventListener({ name: 'prePublish',  handler: normalizeOnEvent });

          // ✅ 更穩的 h 來源（preact）
          const h =
            (window.h) ||
            (window.preact && window.preact.h) ||
            (CMS && CMS.lib && CMS.lib.h);

          // 如果 h 仍不可用，就先不註冊預覽，避免报錯中斷
          if (!h) return;

          const ProjectPreview = (props) => {
            const e = props.entry;
            const title = e.getIn(['data','title_zh']) || e.getIn(['data','title_en']) || 'Untitled';
            const cover = normalizeUrl(e.getIn(['data','cover'])) || normalizeUrl(e.getIn(['data','thumbnail']));
            return h('div', { class: 'cms-preveiw-content', style: { maxWidth: '900px', margin: '0 auto', padding: '12px' } },
              cover ? h('img', { src: cover, alt: title, style:{maxWidth:'100%',display:'block',marginBottom:'12px',objectFit:'cover'} }) : null,
              h('h1', { style:{fontSize:'20px',margin:'8px 0'} }, title),
              h('div', null, props.widgetFor && (props.widgetFor('body_zh') || props.widgetFor('body_en')) || '')
            );
          };
          try { CMS.registerPreviewTemplate('projects', ProjectPreview); } catch {}
        }

        ready(install);
      })();
    </script>

    <!-- 你的 CMS 初始化（如有自訂預覽樣式/小工具就放 cms.js） -->
    <script src="/admin/cms.js"></script>
  </body>
</html>
