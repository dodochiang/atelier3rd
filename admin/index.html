<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Content Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Optional: Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- 後台整體樣式（縮小版 UI） -->
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body>
    <!-- Decap CMS v3 -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Cloudinary media library plugin -->
    <script src="https://unpkg.com/decap-cms-media-library-cloudinary@^3.0.0/dist/decap-cms-media-library-cloudinary.js"></script>

    <script>
      (function () {
        function ready(fn){
          if (document.readyState !== 'loading') fn();
          else document.addEventListener('DOMContentLoaded', fn);
        }

        // 將任何型態（List / Map / Object / String）正規化為乾淨字串 URL
        function normalizeThumbValue(v) {
          try {
            // Immutable List: 取第一個
            if (v && typeof v.get === 'function' && typeof v.size === 'number') {
              v = v.size > 0 ? v.get(0) : '';
            }
            // Immutable Map: 取 url/path/src
            if (v && typeof v.get === 'function' && typeof v.size !== 'number') {
              v = v.get('url') || v.get('path') || v.get('src') || '';
            }
            // 一般物件
            if (v && typeof v === 'object') {
              v = v.url || v.path || v.src || '';
            }
            // 字串：去掉 ["..."] / 收尾雜字元
            if (typeof v === 'string') {
              v = v.replace(/^[\[\s"]+/, '').replace(/[\s"\]]+$/, '');
              // 防呆：若還殘留 List[...] 之類污染，乾脆清空避免 404
              if (/\bList\b|\[|\]/.test(v)) return '';
            }
            return (typeof v === 'string') ? v : '';
          } catch (e) {
            return '';
          }
        }

        function addGuards() {
          if (!window.CMS) return;

          // 介面語系鎖 en，避免缺字典的奇怪文案
          try { CMS.setLocale && CMS.setLocale('en'); } catch (e) {}

          // 媒體庫（與 config.yml 相符即可；重複註冊無害）
          try { CMS.registerMediaLibrary(cloudinary); } catch (e) {}

          // 讓預覽吃到你的樣式（你已在 cms.js 內可再補充）
          try { CMS.registerPreviewStyle('/admin/preview.css'); } catch (e) {}

          // ✅ 存檔前與發布前：把 projects.thumbnail 正規化為「單一字串 URL」
          function normalizeOnEvent({ entry, collection }) {
            if (!collection || collection.get('name') !== 'projects') return;

            const data = entry.get('data');
            let tn = data && data.get && data.get('thumbnail');
            const normalized = normalizeThumbValue(tn);

            if (normalized) {
              return { entry: entry.set('data', data.set('thumbnail', normalized)) };
            }
            // 若被清成空字串也一併寫回，避免殘留壞格式
            if (tn && normalized === '') {
              return { entry: entry.set('data', data.set('thumbnail', '')) };
            }
          }

          CMS.registerEventListener({ name: 'preSave',    handler: normalizeOnEvent });
          CMS.registerEventListener({ name: 'prePublish', handler: normalizeOnEvent });

          // （可選）編輯期間即時把欄位值清乾淨：避免右側預覽在存檔前顯示 List%20[…]
          // 註：這段僅影響編輯器內部 state，不碰你的前台。
          try {
            CMS.registerEventListener({
              name: 'entryChange',
              handler: ({ entry, collection }) => {
                if (!collection || collection.get('name') !== 'projects') return;
                const data = entry.get('data');
                let tn = data && data.get && data.get('thumbnail');
                const normalized = normalizeThumbValue(tn);
                if (typeof tn !== 'string' || tn !== normalized) {
                  return { entry: entry.set('data', data.set('thumbnail', normalized)) };
                }
              }
            });
          } catch (e) {}
        }

        ready(addGuards);
      })();
    </script>

    <!-- 你的 CMS 初始化（Cloudinary 註冊、Preview 樣式、Project/Pages 預覽模板…） -->
    <script src="/admin/cms.js"></script>
  </body>
</html>
