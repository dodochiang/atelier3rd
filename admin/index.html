<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Content Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Optional: Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- 後台整體樣式（縮小版 UI） -->
    <link rel="stylesheet" href="/admin/admin.css">
  </head>
  <body>
    <!-- Decap CMS v3 -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Cloudinary media library plugin -->
    <script src="https://unpkg.com/decap-cms-media-library-cloudinary@^3.0.0/dist/decap-cms-media-library-cloudinary.js"></script>

    <!-- ✅ 建議新增：先把語系鎖成官方英文，避免殘缺字典造成 editor.* 文案外漏 -->
    <script>
      (function () {
        function ready(fn){ if (document.readyState !== 'loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
        ready(function () {
          if (window.CMS && CMS.setLocale) {
            CMS.setLocale('en'); // 不覆蓋字典，只選用官方 en
          }
          // 如果你想預覽面板也吃到樣式，可選擇這裡先註冊（或維持在 cms.js 內）
          try { CMS.registerPreviewStyle('/admin/preview.css'); } catch (e) {}
        });
      })();
      // 讓「縮圖」欄位永遠存成單一字串（即便 Cloudinary UI 附加了多張）
CMS.registerEventListener({
  name: 'preSave',
  handler: ({ entry, collection }) => {
    if (!collection || collection.get('name') !== 'projects') return;

    const data = entry.get('data');
    const tn = data && data.get && data.get('thumbnail');

    // 判斷是不是 Immutable List（被多選附加時常出現）
    const looksLikeList = tn && typeof tn.get === 'function' && typeof tn.size === 'number';
    if (looksLikeList && tn.size > 0) {
      const first = tn.get(0); // 取第一張
      const nextData = data.set('thumbnail', first);
      return { entry: entry.set('data', nextData) };
    }

    // 有些情況會變成字串但帶 ["..."] 或尾巴帶 "] 之類髒字元，一併清理
    if (typeof tn === 'string') {
      const cleaned = tn.replace(/^[\[\s"]+/, '').replace(/[\s"\]]+$/, '');
      if (cleaned !== tn) {
        const nextData = data.set('thumbnail', cleaned);
        return { entry: entry.set('data', nextData) };
      }
    }
  }
});
    </script>

    <!-- 你的 CMS 初始化（Cloudinary 註冊、Preview 樣式、Project/Pages 預覽模板…） -->
    <script src="/admin/cms.js"></script>
  </body>
</html>
