<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Content Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link rel="stylesheet" href="/admin/admin.css">
    <link rel="stylesheet" href="/admin/preview.css">
  </head>
  <body>
    <!-- Decap CMS v3 -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Cloudinary media library plugin -->
    <script src="https://unpkg.com/decap-cms-media-library-cloudinary@^3.0.0/dist/decap-cms-media-library-cloudinary.js"></script>

    <script>
      // --- 只貼這段：覆蓋 ProjectPreview（用 preact h） ---
      (function () {
        function hCompat() {
          return (window.h) || (window.preact && window.preact.h) || (CMS && CMS.lib && CMS.lib.h);
        }

        function text(el, str) { return el ? str : ''; }

        // 取你前面已經定義的 normalizeUrl，如果沒有就定義個最小版：
        var normalizeUrl = window.normalizeUrl || function (v) {
          try {
            if (Array.isArray(v)) v = v.length ? v[v.length - 1] : '';
            if (v && typeof v.get === 'function' && typeof v.size === 'number') v = v.size ? v.get(v.size - 1) : '';
            if (v && typeof v.get === 'function' && typeof v.size !== 'number') v = v.get('secure_url') || v.get('url') || v.get('path') || v.get('src') || '';
            if (v && typeof v === 'object') v = v.secure_url || v.url || v.path || v.src || '';
            if (typeof v === 'string') {
              let s = v.trim().replace(/^[\[\s"]+/, '').replace(/[\s"\]]+$/, '').replace(/%22/g,'');
              const urls = s.match(/https?:\/\/[^\s"'\]]+/g);
              if (urls && urls.length) s = urls[urls.length - 1];
              if (/\bList\b|\[|\]/.test(s)) return '';
              return s;
            }
            return '';
          } catch { return ''; }
        };

        function ProjectPreview(props) {
          var h = hCompat();
          if (!h) return null;

          const e = props.entry;
          const get = (k) => e.getIn(['data', k]);
          const titleEn = get('title_en') || '';
          const titleZh = get('title_zh') || '';
          const type     = get('type') || '';
          const locEn    = get('location_en') || '';
          const locZh    = get('location_zh') || '';
          const year     = get('year') || '';
          const units    = get('units');
          const fa       = get('floor_area');
          const creditsEn= get('credits_en') || '';
          const creditsZh= get('credits_zh') || '';
          const video    = get('video') || '';
          const cover    = normalizeUrl(get('cover')) || normalizeUrl(get('thumbnail'));

          // body_zh / body_en 對應 Markdown widget
          const bodyEn = props.widgetFor && props.widgetFor('body_en');
          const bodyZh = props.widgetFor && props.widgetFor('body_zh');

          // gallery（只取第一張展示即可，避免預覽太複雜）
          let gallery = get('gallery');
          let galleryImages = get('gallery_images');
          let galleryFirst = '';
          if (gallery && typeof gallery.toJS === 'function') {
            const arr = gallery.toJS();
            const raw = (arr[0] && (arr[0].image || arr[0])) || '';
            galleryFirst = normalizeUrl(raw);
          } else if (galleryImages && typeof galleryImages.toJS === 'function') {
            const arr = galleryImages.toJS();
            galleryFirst = normalizeUrl(arr[0] || '');
          }

          // 小工具：單位/面積字樣
          const unitsEn = (typeof units === 'number' || (units||'').toString().trim()) ? `${units} units` : '';
          const unitsZh = (typeof units === 'number' || (units||'').toString().trim()) ? `${units}戶` : '';
          let faEn = '', faZh = '';
          if (fa !== undefined && fa !== null && (fa+'').trim() !== '') {
            const s = (fa+'');
            if (/㎡|m²|sqm/i.test(s)) { faEn = s; faZh = s; }
            else { faEn = s + ' sqm'; faZh = s + '㎡'; }
          }

          return h('div', { class: 'cms-preview-content' },
            // Hero
            cover ? h('div', { class: 'project-hero' },
              h('img', { src: cover, alt: (titleEn || titleZh || 'Cover'), loading: 'lazy', decoding: 'async' })
            ) : null,

            // Title
            h('h1', { class: 'project-title' },
              h('span', { class: 'lang-en' }, titleEn || ''),
              ' ',
              h('span', { class: 'lang-zh' }, titleZh || '')
            ),

            // Meta line 1：類型｜地點
            h('p', { class: 'project-meta-line' },
              h('span', { class: 'lang-en' }, [type || '', (locEn ? ' ｜ ' + locEn : '')]),
              h('span', { class: 'lang-zh' }, [type || '', (locZh ? ' ｜ ' + locZh : '')])
            ),

            // Meta line 2：戶數｜面積｜年份
            h('p', { class: 'project-meta-line' },
              h('span', { class: 'lang-en' }, [unitsEn, (faEn ? ' ｜ ' + faEn : ''), (year ? ' ｜ ' + year : '')]),
              h('span', { class: 'lang-zh' }, [unitsZh, (faZh ? ' ｜ ' + faZh : ''), (year ? ' ｜ ' + year : '')])
            ),

            // 內文
            h('div', { class: 'project-content' },
              h('div', { class: 'lang-en' }, bodyEn || ''),
              h('div', { class: 'lang-zh' }, bodyZh || '')
            ),

            // Credits
            (creditsEn || creditsZh) ? h('div', { class: 'project-credits' },
              h('div', { class: 'lang-en' }, props.widgetFor && props.widgetFor('credits_en')),
              h('div', { class: 'lang-zh' }, props.widgetFor && props.widgetFor('credits_zh'))
            ) : null,

            // Gallery（預覽只顯示第一張）
            galleryFirst ? h('div', { class: 'project-slider' },
              h('div', { class: 'slide-image-wrapper' },
                h('img', { src: galleryFirst, alt: 'gallery image' })
              )
            ) : null,

            // YouTube（embed URL）
            (typeof video === 'string' && /^https:\/\/www\.youtube\.com\/embed\//.test(video))
              ? h('div', { class: 'project-video', style: { textAlign: 'center', marginTop: '20px' } },
                  h('div', { class: 'video-container' },
                    h('iframe', { src: video, title: 'YouTube video', frameBorder: '0', allowFullScreen: true })
                  )
                )
              : null
          );
        }

        // 重新註冊
        try { CMS.registerPreviewTemplate('projects', ProjectPreview); } catch (e) {}
      })();
    </script>

    <script src="/admin/cms.js"></script>
  </body>
</html>
